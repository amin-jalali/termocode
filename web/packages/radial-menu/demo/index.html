  html, body { margin: 0; min-height: 100%; background: #07070a; color: #9a9aa4; font-family: ui-monospace, monospace; }

<div id="inline"></div>
<p class="hint">tap the <b>center</b> to open / close · tap a category to switch (no back)<br>tap an action to run · <b>hold</b> it for details &amp; <b>★ favorite</b><br>the floating button: tap to open · <b>hold</b> to pick it up and drag</p>
