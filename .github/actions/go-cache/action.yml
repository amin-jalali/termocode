name: Go build and module cache
description: >-
  Restores the Go module and build cache of one kind of job (the newest one
  saved on main). With save "true" (one job per kind, on main) it saves a
  fresh copy at the end of the job, so the cache follows main instead of
  staying at the first copy ever saved for a go.sum.
inputs:
  kind:
    description: cache family, e.g. race, plain, web-e2e
    required: true
  save:
    description: "'true' to save the cache when the job ends (main only)"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
        key: ${{ runner.os }}-gobuild-${{ inputs.kind }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-gobuild-${{ inputs.kind }}-${{ hashFiles('**/go.sum') }}-
          ${{ runner.os }}-gobuild-${{ inputs.kind }}-
          ${{ runner.os }}-go-

    # A composite action has no post step: this marks the key, and the
    # job's last step (.github/actions/go-cache-save) saves it.
    - name: Mark the save
      if: inputs.save == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: echo "GO_CACHE_SAVE_KEY=${{ runner.os }}-gobuild-${{ inputs.kind }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}" >> "$GITHUB_ENV"
