name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install X11 dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Termux on Android: the binary must build without cgo, and the
      # cgo build must not pull in golang.design/x/clipboard (its Android
      # backend needs an APK with a Java VM).
      - name: Android (Termux) build
        if: runner.os == 'Linux'
        run: |
          GOOS=android GOARCH=arm64 go vet ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o /dev/null ./cmd/termocode
          if CGO_ENABLED=1 GOOS=android GOARCH=arm64 go list -deps ./cmd/termocode | grep -q '^golang.design/x/clipboard$'; then
            echo "android build must not import golang.design/x/clipboard" >&2
            exit 1
          fi

      - name: Test
        run: go test ./... -race -count=1

      # The patched Bubble Tea renderer (third_party/bubbletea/PATCHES.md).
      - name: Test the renderer patch
        run: go -C third_party/bubbletea test -race -count=1 -run TestRendererIdlesAndWakes .

      - name: Reference docs up to date
        if: runner.os == 'Linux'
        run: go run ./cmd/docgen -check

      - name: Shellcheck release and install scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/build-release.sh scripts/release.sh

  # End-to-end: the real binary in a PTY + VT emulator (e2e/, build tag
  # e2e). Needs nvim; on failure the screen dumps are uploaded.
  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      NVIM_VERSION: v0.11.4
      E2E_DUMP_DIR: ${{ github.workspace }}/e2e-dumps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install X11 dev headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-e2e-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-e2e-
            ${{ runner.os }}-go-

      - name: Install Neovim (pinned release)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Neovim version
        run: nvim --version | head -1

      - name: E2E tests
        run: go -C e2e test -tags e2e -count=1 -v ./...

      - name: Upload screen dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screen-dumps
          path: e2e-dumps/
          if-no-files-found: ignore
