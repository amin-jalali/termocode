name: test

on:
  push:
    branches: [main, "land-*", "feat/land-*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to a branch, PR or main cancels the older run of it, so only
# the newest commit of each is tested. On main this means a merge that lands
# while the run of the one before is still going stops that run: commits
# land one by one after their own MR was green, so testing the newest main
# commit covers them all and the queue never fills with one full run per
# merge. The cost: a main commit that was replaced is never tested alone,
# so a red main run can point at a few merges, not one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Required checks (CONTRIBUTING.md): keep these job names stable.
#   test (ubuntu-latest), test (macos-latest), golden screens (ubuntu-latest),
#   e2e (ubuntu-latest), e2e (macos-latest), web-e2e (ubuntu-latest),
#   web-e2e (macos-latest), coverage (ubuntu-latest)
# The slow jobs run as parallel shards ("test (ubuntu-latest, 2/4)"); a
# small job with the old name waits for all shards and fails if one did.
# A skipped job counts as passed, so a PR skips the jobs its files do not
# need through the "changes" job (scripts/ci-changes.sh; a workflow-level
# paths filter would leave the required checks waiting forever). Pushes
# (main) and runs started by hand always run every job.
#
# Caches: .github/actions/go-cache restores the newest Go build + module
# cache of its kind that main saved (one job per kind saves it on main);
# .github/actions/setup-nvim keeps the pinned Neovim tarball. Chrome ships
# with both runner images, so nothing is downloaded for it.

jobs:
  # Which jobs the change needs (scripts/ci-changes.sh).
  changes:
    name: changes
    # Draft PRs get no CI. Every other job needs this one, so they skip too.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      web: ${{ steps.diff.outputs.web }}
      heavy: ${{ steps.diff.outputs.heavy }}
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Changed files
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          files=""
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE...$HEAD")
          fi
          printf '%s\n' "$files" | scripts/ci-changes.sh "$EVENT" | tee -a "$GITHUB_OUTPUT"

  # Build, vet, the "generated files up to date" checks and the CI script
  # tests, once, beside the test shards.
  checks:
    name: checks (ubuntu-latest)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install X11 dev headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: plain
          save: "true"

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Termux on Android: the binary must build without cgo, and the
      # cgo build must not pull in golang.design/x/clipboard (its Android
      # backend needs an APK with a Java VM).
      - name: Android (Termux) build
        run: |
          GOOS=android GOARCH=arm64 go vet ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o /dev/null ./cmd/termocode
          # The release build: cgo with the NDK clang (see release.yml).
          CC="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -o /dev/null ./cmd/termocode
          if CGO_ENABLED=1 GOOS=android GOARCH=arm64 go list -deps ./cmd/termocode | grep -q '^golang.design/x/clipboard$'; then
            echo "android build must not import golang.design/x/clipboard" >&2
            exit 1
          fi

      # CMP-95: a native Windows build compiles and vets (no behavior
      # claim beyond that; WSL stays the supported way on Windows).
      - name: Windows native build
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./...

      - name: Reference docs up to date
        run: go run ./cmd/docgen -check

      - name: Web protocol types up to date
        run: |
          go generate ./internal/webproto
          git diff --exit-code -- internal/webproto

      # The browser assets are built by the esbuild Go API (no node).
      - name: Web assets up to date
        run: |
          go generate ./internal/webgw/assets
          git diff --exit-code -- internal/webgw/assets

      - name: Shellcheck release, install and CI scripts
        run: shellcheck scripts/install.sh scripts/build-release.sh scripts/release.sh scripts/ci-test-shard.sh scripts/ci-changes.sh scripts/ci-changes_test.sh

      - name: CI job picker tests
        run: scripts/ci-changes_test.sh

      # A PR that changes a package the browser suite builds on must run
      # the web jobs: every such package must be in WEB_DEPS.
      - name: Web job filter knows every web dependency
        run: |
          set -euo pipefail
          M=github.com/amin-jalali/termocode
          bad=0
          for d in $(cd e2e && go list -tags browser,webdev -deps -test ./web/ | grep "^$M/" | grep -v '\.test\|\[' | sed "s|^$M/||"); do
            if ! echo "$d/x.go" | scripts/ci-changes.sh pull_request | grep -q '^web=true$'; then
              echo "e2e/web builds on $d: add it to WEB_DEPS in scripts/ci-changes.sh" >&2
              bad=1
            fi
          done
          exit "$bad"

      # The test shards must run every package and every test exactly once.
      - name: Test shards cover everything once
        run: |
          set -euo pipefail
          for n in 4 3; do
            for i in $(seq "$n"); do scripts/ci-test-shard.sh -list "$i" "$n"; done > "$RUNNER_TEMP/plan.txt"
            if sort "$RUNNER_TEMP/plan.txt" | uniq -d | grep .; then
              echo "a package or test is in two shards (n=$n)" >&2; exit 1
            fi
            want=$(go list ./... | wc -l)
            got=$(grep -c '^pkg ' "$RUNNER_TEMP/plan.txt" || true)
            split=$(go list ./internal/app ./internal/testkit ./internal/mdview ./internal/git | wc -l)
            if [ "$((got + split))" -ne "$want" ]; then
              echo "n=$n: shards have $got whole packages + $split split, go list has $want" >&2; exit 1
            fi
            [ "$(grep -c '^test ' "$RUNNER_TEMP/plan.txt")" -gt 1000 ] || { echo "too few split tests" >&2; exit 1; }
          done
          for i in 1 2; do (cd e2e && CI_DEAL_PKGS= CI_SPLIT_PKGS=./web/ CI_TAGS=browser,webdev ../scripts/ci-test-shard.sh -list "$i" 2); done > "$RUNNER_TEMP/web.txt"
          [ "$(grep -c '^test ' "$RUNNER_TEMP/web.txt")" -gt 100 ] || { echo "too few web e2e tests" >&2; exit 1; }
          ! sort "$RUNNER_TEMP/web.txt" | uniq -d | grep .

      - name: Save the Go cache (main)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache-save

  # go test ./... -race in parallel shards (scripts/ci-test-shard.sh): the
  # small packages are dealt out whole, internal/app, testkit, mdview and
  # git are split by test name. On main (and runs started by hand) the
  # shards also write the coverage profiles.
  test-linux:
    name: test (ubuntu-latest, ${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      COVER: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'land-') || startsWith(github.ref_name, 'feat/land-'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # sqlite3: the internal/dbclient tests that drive the CLI skip
      # without it.
      - name: Install X11 dev headers and sqlite3
        run: sudo apt-get update && sudo apt-get install -y libx11-dev sqlite3

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: race
          save: ${{ matrix.shard == 1 }}

      - name: Download modules
        run: go mod download

      # No nvim here, as in the old test job: the nvim-based scenario tests
      # skip. Under -race they time out (24 failed in one shard, 2026-11-06),
      # and 4 of them fail even without -race (they were hidden in the old
      # coverage job, which ignored failures).
      - name: Test
        run: |
          set -euo pipefail
          if [ "$COVER" = true ]; then
            export CI_COVER_DIR="$RUNNER_TEMP/cov" CI_COVERPKG="$(go run ./cmd/covreport -print-coverpkg)"
          fi
          scripts/ci-test-shard.sh ${{ matrix.shard }} 4 -race -count=1 -timeout 25m -skip '^TestGoldenScreens$'

      # The patched Bubble Tea renderer (third_party/bubbletea/PATCHES.md).
      - name: Test the renderer patch
        if: matrix.shard == 1
        run: go -C third_party/bubbletea test -race -count=1 -run TestRendererIdlesAndWakes .

      - name: Upload the cover profiles
        if: ${{ !cancelled() && env.COVER == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cover-test-${{ matrix.shard }}
          path: ${{ runner.temp }}/cov/*.out
          if-no-files-found: ignore
          retention-days: 3

      - name: Save the Go cache (main)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache-save

  test-macos:
    name: test (macos-latest, ${{ matrix.shard }}/3)
    needs: changes
    # Docs-only changes still run it (code=false), as before; a PR with
    # only browser sources or e2e files skips it (heavy=false).
    if: needs.changes.outputs.heavy == 'true' || needs.changes.outputs.code == 'false'
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: race
          save: ${{ matrix.shard == 1 }}

      - name: Download modules
        run: go mod download

      - name: Vet
        if: matrix.shard == 1
        run: go vet ./...

      - name: Test
        run: scripts/ci-test-shard.sh ${{ matrix.shard }} 3 -race -count=1 -timeout 25m

      - name: Test the renderer patch
        if: matrix.shard == 1
        run: go -C third_party/bubbletea test -race -count=1 -run TestRendererIdlesAndWakes .

      - name: Save the Go cache (main)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache-save

  # The old one-job names: green only when every shard (and the checks) is.
  test-linux-result:
    name: test (ubuntu-latest)
    needs: [checks, test-linux]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed
        env:
          RESULTS: ${{ needs.checks.result }} ${{ needs.test-linux.result }}
        run: |
          echo "checks, shards: $RESULTS"
          [ "$RESULTS" = "success success" ]

  test-macos-result:
    name: test (macos-latest)
    needs: [changes, test-macos]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed (or skipped)
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.test-macos.result }}
        run: |
          echo "changes: $CHANGES, shards: $RESULT"
          [ "$CHANGES" = success ] && { [ "$RESULT" = success ] || [ "$RESULT" = skipped ]; }

  # Golden screens (internal/devtools/shotkit): they start nvim. The
  # harness fixes TZ, locale, clock, PATH and HOME for every case. Four
  # shards (SHOTKIT_GOLDEN_SHARD=i/4): every case runs in one of them.
  golden:
    name: golden screens (ubuntu-latest, ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHOTKIT_GOLDEN_SHARD: ${{ matrix.shard }}/4
      COVER: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'land-') || startsWith(github.ref_name, 'feat/land-'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install X11 dev headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: plain

      # The nvim the golden frames were made with: editor screens can
      # change between nvim releases.
      - name: Neovim
        uses: ./.github/actions/setup-nvim
        with:
          version: v0.12.2

      - name: Golden screens
        # ~540 cases (a quarter per shard), each a child app with its own nvim.
        env:
          SHOTKIT_GOLDEN_JOBS: "4"
        run: |
          set -euo pipefail
          cover=()
          if [ "$COVER" = true ]; then
            mkdir -p "$RUNNER_TEMP/cov"
            cover=("-coverpkg=$(go run ./cmd/covreport -print-coverpkg)" "-coverprofile=$RUNNER_TEMP/cov/golden.out")
          fi
          go test ./internal/devtools/shotkit -run 'Golden' -count=1 -timeout 45m "${cover[@]+"${cover[@]}"}" \
            | sed -E 's/(of statements in ).*/\1-coverpkg/'

      # Coverage only (main): the nvim-based unit tests, which skip in the
      # -race test shards (no nvim there). Without -race, like the old
      # coverage job, and failures do not fail the job: the test shards
      # gate, this only counts lines.
      - name: Coverage of the nvim-based tests (main)
        if: ${{ !cancelled() && env.COVER == 'true' }}
        env:
          CI_DEAL_PKGS: ./internal/editor ./internal/nvim ./internal/testkit/specui
          CI_SPLIT_PKGS: ./internal/app ./internal/testkit
        run: |
          CI_COVER_DIR="$RUNNER_TEMP/cov" CI_COVERPKG="$(go run ./cmd/covreport -print-coverpkg)" \
            scripts/ci-test-shard.sh ${{ matrix.shard }} 4 -count=1 -timeout 25m -skip '^TestGoldenScreens$' \
            || echo "::notice::some nvim-based tests failed; coverage counts what ran"

      - name: Upload changed frames
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-frames-${{ matrix.shard }}
          path: internal/devtools/shotkit/testdata/golden/*_actual.*
          if-no-files-found: ignore

      - name: Upload the cover profile
        if: ${{ !cancelled() && env.COVER == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cover-golden-${{ matrix.shard }}
          path: ${{ runner.temp }}/cov/*.out
          if-no-files-found: ignore
          retention-days: 3

  golden-result:
    name: golden screens (ubuntu-latest)
    needs: [changes, golden]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed (or skipped)
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.golden.result }}
        run: |
          echo "changes: $CHANGES, shards: $RESULT"
          [ "$CHANGES" = success ] && { [ "$RESULT" = success ] || [ "$RESULT" = skipped ]; }

  # End-to-end: the real binary in a PTY + VT emulator (e2e/, build tag
  # e2e). Needs nvim; on failure the screen dumps are uploaded.
  e2e:
    name: e2e (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_DUMP_DIR: ${{ github.workspace }}/e2e-dumps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install X11 dev headers and sqlite3
        run: sudo apt-get update && sudo apt-get install -y libx11-dev sqlite3

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: plain

      - name: Neovim
        uses: ./.github/actions/setup-nvim
        with:
          version: v0.11.4

      - name: E2E tests
        run: go -C e2e test -tags e2e -count=1 -timeout 30m -v ./...

      - name: Upload screen dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screen-dumps
          path: e2e-dumps/
          if-no-files-found: ignore

  # The same e2e suite on macOS (PTYs, temp paths through /var →
  # /private/var, BSD tools). Slower and scarcer runners: only for PRs and
  # pushes to main, not for every push to a feature branch.
  e2e-macos:
    name: e2e (macos-latest)
    needs: changes
    if: >-
      needs.changes.outputs.e2e == 'true' &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'land-') || startsWith(github.ref_name, 'feat/land-'))
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      E2E_DUMP_DIR: ${{ github.workspace }}/e2e-dumps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: plain
          save: "true"

      - name: Neovim
        uses: ./.github/actions/setup-nvim
        with:
          version: v0.11.4

      - name: sqlite3 version
        run: sqlite3 --version

      - name: E2E tests
        run: go -C e2e test -tags e2e -count=1 -timeout 30m -v ./...

      - name: Upload screen dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screen-dumps-macos
          path: e2e-dumps/
          if-no-files-found: ignore

      - name: Save the Go cache (main)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache-save

  # Coverage per system (cmd/covreport, scripts/coverage-systems.txt). It
  # fails when a system is below its floor in scripts/coverage-floors.txt.
  # No test run of its own: it merges the profiles the test and golden
  # shards wrote (the golden shards add the nvim-based unit tests) (unit tests only: the e2e suite adds ~0.5 points and 5+
  # minutes, and a flaky e2e test would move the numbers). Only for main
  # (and land branches, and runs started by hand): a PR does not wait for
  # it. Failing tests do not stop it: the test jobs catch those.
  coverage:
    name: coverage (ubuntu-latest)
    needs: [changes, test-linux, golden]
    if: >-
      always() && needs.changes.outputs.code == 'true' &&
      needs.test-linux.result != 'cancelled' && needs.test-linux.result != 'skipped' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'land-') || startsWith(github.ref_name, 'feat/land-'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install X11 dev headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: plain

      - name: Download the shard profiles
        uses: actions/download-artifact@v4
        with:
          pattern: cover-*
          path: ${{ runner.temp }}/shards

      # covreport skips every "mode:" line and adds up blocks seen twice.
      - name: Merge the profiles
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cov"
          ls -R "$RUNNER_TEMP/shards"
          n=$(find "$RUNNER_TEMP/shards" -name '*.out' | wc -l)
          echo "$n profiles"
          # At least 4 test shards x 2 + 4 golden shards; fewer means a
          # shard died.
          [ "$n" -ge 12 ] || { echo "expected 12 profiles, got $n" >&2; exit 1; }
          { echo "mode: count"; find "$RUNNER_TEMP/shards" -name '*.out' -exec grep -hv '^mode:' {} +; } > "$RUNNER_TEMP/cov/merged.out"

      - name: Table and floors
        run: |
          set +e
          go run ./cmd/covreport -profile "$RUNNER_TEMP/cov/merged.out" \
            -floors scripts/coverage-floors.txt -top 10 \
            > "$RUNNER_TEMP/coverage.txt" 2> "$RUNNER_TEMP/below.txt"
          status=$?
          set -e
          cat "$RUNNER_TEMP/coverage.txt" "$RUNNER_TEMP/below.txt"
          {
            echo "## Coverage per system"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Every system is at or above its floor (scripts/coverage-floors.txt)."
            else
              echo "**Below the floor** (scripts/coverage-floors.txt):"
              echo
              echo '```'
              cat "$RUNNER_TEMP/below.txt"
              echo '```'
            fi
            echo
            echo '```'
            awk 'NF {p=1} p {print} /^Total /{exit}' "$RUNNER_TEMP/coverage.txt"
            echo '```'
            echo
            echo "<details><summary>Biggest uncovered functions</summary>"
            echo
            echo '```'
            awk 'f {print} /^Total /{f=1}' "$RUNNER_TEMP/coverage.txt"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/coverage.txt" "$RUNNER_TEMP/cov/coverage.txt"
          exit "$status"

      - name: Upload the profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: |
            ${{ runner.temp }}/cov/merged.out
            ${{ runner.temp }}/cov/coverage.txt
          if-no-files-found: ignore

  # The web page in a real Chrome (e2e/web, build tags browser + webdev):
  # the embedded page behind the real gateway guard, CSP and /auth, with a
  # fake hub on /ws; then the real-binary walk (WEB-28). Both runner
  # images ship Chrome; a missing Chrome fails here instead of skipping.
  # Screenshots of failures are uploaded. Two shards per system, split by
  # test name. A PR that touches no web code skips them (changes.web).
  web-e2e:
    name: web-e2e (ubuntu-latest, ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TERMOCODE_WEB_E2E: require
      WEB_E2E_DUMP_DIR: ${{ github.workspace }}/web-e2e-dumps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: web-e2e
          save: ${{ matrix.shard == 1 }}

      # Half of the e2e/web tests per shard, split by test name.
      - name: Web e2e tests
        working-directory: e2e
        env:
          CI_DEAL_PKGS: ""
          CI_SPLIT_PKGS: ./web/
          CI_TAGS: browser,webdev
        run: ../scripts/ci-test-shard.sh ${{ matrix.shard }} 2 -tags browser,webdev -race -count=1 -v -timeout 30m

      # The same page against the real binary in a PTY (e2e/web_real_test.go,
      # tags e2e + browser): termocode web start → link → auth → chat with a
      # fake AI → card → file → terminal → commit → web stop. Needs nvim.
      # Only in shard 2.
      - name: Install X11 dev headers (Linux)
        if: runner.os == 'Linux' && matrix.shard == 2
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Neovim
        if: matrix.shard == 2
        uses: ./.github/actions/setup-nvim
        with:
          version: v0.11.4

      - name: Web e2e tests against the real binary
        if: matrix.shard == 2
        env:
          E2E_DUMP_DIR: ${{ github.workspace }}/web-e2e-dumps
        run: go -C e2e test -tags e2e,browser -count=1 -v -timeout 15m -run 'TestWebReal' .

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-dumps-ubuntu-latest-${{ matrix.shard }}
          path: web-e2e-dumps/
          if-no-files-found: ignore

      - name: Save the Go cache (main)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache-save

  web-e2e-macos:
    name: web-e2e (macos-latest, ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TERMOCODE_WEB_E2E: require
      WEB_E2E_DUMP_DIR: ${{ github.workspace }}/web-e2e-dumps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: web-e2e
          save: ${{ matrix.shard == 1 }}

      # Half of the e2e/web tests per shard, split by test name.
      - name: Web e2e tests
        working-directory: e2e
        env:
          CI_DEAL_PKGS: ""
          CI_SPLIT_PKGS: ./web/
          CI_TAGS: browser,webdev
        run: ../scripts/ci-test-shard.sh ${{ matrix.shard }} 2 -tags browser,webdev -race -count=1 -v -timeout 30m

      # The same page against the real binary in a PTY (e2e/web_real_test.go,
      # tags e2e + browser): termocode web start → link → auth → chat with a
      # fake AI → card → file → terminal → commit → web stop. Needs nvim.
      # Only in shard 2.
      - name: Install X11 dev headers (Linux)
        if: runner.os == 'Linux' && matrix.shard == 2
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Neovim
        if: matrix.shard == 2
        uses: ./.github/actions/setup-nvim
        with:
          version: v0.11.4

      - name: Web e2e tests against the real binary
        if: matrix.shard == 2
        env:
          E2E_DUMP_DIR: ${{ github.workspace }}/web-e2e-dumps
        run: go -C e2e test -tags e2e,browser -count=1 -v -timeout 15m -run 'TestWebReal' .

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-dumps-macos-latest-${{ matrix.shard }}
          path: web-e2e-dumps/
          if-no-files-found: ignore

      - name: Save the Go cache (main)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache-save

  web-e2e-result:
    name: web-e2e (ubuntu-latest)
    needs: [changes, web-e2e]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed (or skipped)
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.web-e2e.result }}
        run: |
          echo "changes: $CHANGES, shards: $RESULT"
          [ "$CHANGES" = success ] && { [ "$RESULT" = success ] || [ "$RESULT" = skipped ]; }

  web-e2e-macos-result:
    name: web-e2e (macos-latest)
    needs: [changes, web-e2e-macos]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed (or skipped)
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.web-e2e-macos.result }}
        run: |
          echo "changes: $CHANGES, shards: $RESULT"
          [ "$CHANGES" = success ] && { [ "$RESULT" = success ] || [ "$RESULT" = skipped ]; }

  # Known vulnerabilities in the code we call (golang.org/x/vuln). The web
  # packages (the network door) must have none: that step fails the job.
  # The whole-module scan is shown but does not fail yet: older x/crypto,
  # x/image, x/text and pgx versions still need a bump of their own.
  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install X11 dev headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Go cache
        uses: ./.github/actions/go-cache
        with:
          kind: plain

      - name: Web packages (must be clean)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./internal/webgw/... ./internal/webproto/...

      - name: Whole module (report only)
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
