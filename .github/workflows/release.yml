name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Release builds use cgo: golang.design/x/clipboard needs it for the
  # system clipboard (read, paste and the clipboard history watch). A
  # CGO_ENABLED=0 binary still runs, but only copies via wl-copy / xclip /
  # pbcopy and cannot paste from or watch the OS clipboard.
  #
  #   linux/amd64   ubuntu-22.04, native gcc + libx11-dev
  #   linux/arm64   ubuntu-22.04, gcc-aarch64-linux-gnu cross compiler.
  #                 The clipboard code dlopen()s libX11 at run time, so
  #                 only the (arch-independent) X11 headers are needed.
  #   darwin/*      macos-14 (Apple Silicon); amd64 via clang -arch x86_64
  #   android/arm64 ubuntu-22.04, the runner's Android NDK clang (API 24 =
  #                 Android 7, Termux's floor). For Termux. cgo here is
  #                 not for the clipboard (the android build leaves it
  #                 out) but for DNS: pure-Go DNS reads /etc/resolv.conf,
  #                 which Android does not have, so a CGO_ENABLED=0 binary
  #                 cannot reach the AI providers. With cgo, Go asks
  #                 Android's libc, which knows the phone's DNS servers.
  #
  # ubuntu-22.04 keeps the glibc floor low (2.35) so the binaries run on
  # older distros too. musl distros (Alpine) need a source build.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-22.04
            cc: gcc
            native: true
          - goos: linux
            goarch: arm64
            runner: ubuntu-22.04
            cc: aarch64-linux-gnu-gcc
            native: false
          - goos: android
            goarch: arm64
            runner: ubuntu-22.04
            cc: ndk
            native: false
          - goos: darwin
            goarch: amd64
            runner: macos-14
            cc: clang -arch x86_64
            native: false
          - goos: darwin
            goarch: arm64
            runner: macos-14
            cc: clang -arch arm64
            native: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install C toolchain and X11 headers (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libx11-dev
          if [ "${{ matrix.goos }}" = android ]; then
            ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
            cc="${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            [ -x "${cc}" ] || { echo "no Android NDK clang at ${cc}" >&2; exit 1; }
            echo "NDK_CC=${cc}" >> "$GITHUB_ENV"
          elif [ "${{ matrix.goarch }}" = arm64 ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            # The cross compiler does not search /usr/include; give it
            # only the X11 headers (plain C declarations, no arch bits).
            mkdir -p "${RUNNER_TEMP}/x11inc"
            cp -r /usr/include/X11 "${RUNNER_TEMP}/x11inc/"
            echo "CGO_CFLAGS=-I${RUNNER_TEMP}/x11inc" >> "$GITHUB_ENV"
          fi

      - name: Build and package
        env:
          CGO_ENABLED: "1"
          MATRIX_CC: ${{ matrix.cc }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          if [ "${MATRIX_CC}" = ndk ]; then export CC="${NDK_CC}"; else export CC="${MATRIX_CC}"; fi
          ./scripts/build-release.sh "${GITHUB_REF_NAME}" "${{ matrix.goos }}" "${{ matrix.goarch }}" dist

      - name: Check the binary
        run: |
          set -euo pipefail
          name="termocode-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p check
          tar -xzf "dist/${name}.tar.gz" -C check
          file "check/${name}/termocode"
          if [ "${{ matrix.goos }}" = android ]; then
            # Must load with Android's linker and use the libc resolver.
            file "check/${name}/termocode" | grep -q '/system/bin/linker64'
            go version -m "check/${name}/termocode" | grep -q 'CGO_ENABLED=1'
          fi
          if [ "${{ matrix.native }}" = true ]; then
            got="$("check/${name}/termocode" --version)"
            echo "${got}"
            [ "${got}" = "termocode ${GITHUB_REF_NAME}" ]
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termocode-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/termocode-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: termocode-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          [ "$(ls -1 ./*.tar.gz | wc -l)" -eq 5 ] || { echo "expected 5 tarballs"; exit 1; }
          sha256sum -- *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Write release notes header
        run: |
          cat > notes.md <<EOF
          ## Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh
          \`\`\`

          Or download the tarball for your system below, check it against
          \`checksums.txt\`, and put \`termocode\` on your \`PATH\`.
          termocode needs Neovim 0.10 or newer. See the
          [install guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/getting-started/install.md).

          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Renders packaging/homebrew + packaging/aur templates with the release
  # checksums and pushes them to the Homebrew tap and the AUR.
  # Each push is skipped (not failed) when its secret is not set, so forks
  # and first releases still work. See CONTRIBUTING.md → "Releases".
  packaging:
    name: homebrew + aur
    runs-on: ubuntu-latest
    needs: release
    # Pre-release tags like v1.0.0-rc1 do not go to package managers.
    if: ${{ !contains(github.ref_name, '-') }}
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'amin-jalali/homebrew-termocode' }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_PACKAGE: termocode-bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render formula and PKGBUILD
        run: ./scripts/render-packaging.sh "${GITHUB_REF_NAME}" dist out "${GITHUB_REPOSITORY}"

      - name: Upload rendered files
        uses: actions/upload-artifact@v4
        with:
          name: packaging-${{ github.ref_name }}
          path: out/
          include-hidden-files: true

      - name: Push Homebrew formula
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp out/termocode.rb tap/Formula/termocode.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/termocode.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "termocode ${GITHUB_REF_NAME}"
          git push

      - name: Push AUR package
        if: ${{ env.AUR_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" aur
          cp out/PKGBUILD out/.SRCINFO aur/
          cd aur
          git config user.name "Amin Jalali"
          git config user.email "amjj.mail@gmail.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && { echo "PKGBUILD unchanged"; exit 0; }
          git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master
