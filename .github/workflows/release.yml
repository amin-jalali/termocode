name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/staging
          binary="termocode"
          go build -trimpath -ldflags="-s -w" -o "dist/staging/${binary}" ./cmd/termocode

      - name: Package tarball
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          os="${{ matrix.goos }}"
          arch="${{ matrix.goarch }}"
          name="termocode-${version}-${os}-${arch}"
          mkdir -p "dist/${name}"
          cp "dist/staging/termocode" "dist/${name}/termocode"
          cp README.md "dist/${name}/README.md"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          echo "tarball=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termocode-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Write checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

  # Renders packaging/homebrew + packaging/aur templates with the release
  # checksums and pushes them to the Homebrew tap and the AUR.
  # Each push is skipped (not failed) when its secret is not set, so forks
  # and first releases still work. See CONTRIBUTING.md → "Releases".
  packaging:
    name: homebrew + aur
    runs-on: ubuntu-latest
    needs: release
    # Pre-release tags like v1.0.0-rc1 do not go to package managers.
    if: ${{ !contains(github.ref_name, '-') }}
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'amin-jalali/homebrew-termocode' }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_PACKAGE: termocode-bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render formula and PKGBUILD
        run: ./scripts/render-packaging.sh "${GITHUB_REF_NAME}" dist out "${GITHUB_REPOSITORY}"

      - name: Upload rendered files
        uses: actions/upload-artifact@v4
        with:
          name: packaging-${{ github.ref_name }}
          path: out/
          include-hidden-files: true

      - name: Push Homebrew formula
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp out/termocode.rb tap/Formula/termocode.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/termocode.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "termocode ${GITHUB_REF_NAME}"
          git push

      - name: Push AUR package
        if: ${{ env.AUR_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" aur
          cp out/PKGBUILD out/.SRCINFO aur/
          cd aur
          git config user.name "Amin Jalali"
          git config user.email "amjj.mail@gmail.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && { echo "PKGBUILD unchanged"; exit 0; }
          git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master
