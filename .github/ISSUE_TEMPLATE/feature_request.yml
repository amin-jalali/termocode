name: Feature request
description: An idea to make termocode better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? How do other editors (VS Code, Neovim, Zed, Warp …) do it?
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
