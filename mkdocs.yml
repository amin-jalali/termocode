site_name: termocode
site_description: "The AI-Integrated Terminal IDE. A fast, full-featured terminal IDE with integrated AI agents and persistent workspaces."
site_url: https://amin-jalali.github.io/termocode/
repo_url: https://github.com/amin-jalali/termocode
repo_name: amin-jalali/termocode
edit_uri: edit/main/docs/
copyright: termocode — see LICENSE in the repository

docs_dir: docs

# docs/embed.go embeds the guide into the app (internal/help); it is
# not a page.
exclude_docs: |
  /embed.go

theme:
  name: material
  language: en
  icon:
    logo: material/console
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/landing.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Pages that exist for contributors but are not linked from the user nav.
not_in_nav: |
  /adr/0000-template.md

nav:
