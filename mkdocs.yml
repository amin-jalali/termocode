      - Find and replace across files: guides/search.md
      - "Git: stage, commit, sync, conflicts": guides/git.md
      - Set up AI: guides/ai-setup.md
      - Use AI: guides/ai-use.md
      - AI profiles and pipelines: guides/ai-profiles.md
      - AI skills: guides/ai-skills.md
      - Itermoc, the AI home: guides/itermoc.md
      - Watch AI runs (Runs): guides/runs.md
      - Connect MCP servers: guides/mcp.md
      - Give your agent the IDE's tools: guides/agents.md
      - Test an HTTP API (.http files): guides/http-client.md
      - Debug a program: guides/debug.md
      - Run and explore tests: guides/tests.md
      - Containers: guides/containers.md
      - Dev services: guides/services.md
      - Browse databases: guides/databases.md
